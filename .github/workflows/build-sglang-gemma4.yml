name: build-sglang-gemma4

# Builds the custom Gemma-4-capable SGLang worker image and pushes it to GHCR.
# Uses the built-in GITHUB_TOKEN (no extra secrets). Image ends up at:
#   ghcr.io/cst2978/gemma4-sglang:latest
on:
  push:
    paths:
      - "sglang-worker/**"
      - ".github/workflows/build-sglang-gemma4.yml"
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The SGLang base image is large (~20GB); reclaim runner disk first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true
          android: true
          dotnet: true
          haskell: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sglang-worker
          push: true
          tags: ghcr.io/cst2978/gemma4-sglang:latest
          provenance: false
