# Declarative RunPod pod config for the Clef SystemOne server.
#     python ti/create_pod.py --config clef-pod/pod.yaml --no-volume
#     python ti/create_pod.py --stop <pod_id>   |  --start <pod_id>  |  --terminate <pod_id>
#
# API_KEY comes from clef_api_key in ti/.env (create_pod.py fills ${CLEF_API_KEY});
# every /v1/* call must send  Authorization: Bearer <key>.  /health stays open.

name: chandra_clef_pod
image: ghcr.io/cst2978/clef-pod:latest
container_registry_auth_id: cmrwjfqz6000zujjcq2ljbyy2

# Full Clef (27B, ~54 GB bf16) needs an 80 GB card. Tried strictly in this order:
# A100 first (fits, cheaper); H100 only if no A100 is available.
# (Clef-flash would fit 48 GB cards: set CLEF_VARIANT: flash and add L40S / A40 here.)
gpu_priority: ordered
gpu_types:
  - NVIDIA A100 80GB PCIe
  - NVIDIA A100-SXM4-80GB
  - NVIDIA H100 80GB HBM3
  - NVIDIA H100 PCIe
cloud_types:
  - COMMUNITY
  - SECURE
gpu_count: 1
# image ~10 GB + Clef weights ~54 GB (no network volume), with headroom
container_disk_gb: 100

ports:
  - 8000/http    # SystemOne API
  - 22/tcp       # SSH

env:
  API_KEY: ${CLEF_API_KEY}
  CLEF_VARIANT: full
  MAX_LENGTH: "16384"
  MAX_BATCH_TOKENS: "16384"    # 27B leaves ~20 GB for activations on an 80 GB card
  # PUBLIC_KEY is injected automatically from ~/.ssh/id_ed25519.pub by create_pod.py
